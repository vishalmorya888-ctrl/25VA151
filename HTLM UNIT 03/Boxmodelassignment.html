<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Box Model Assignment</title>
        <style>
            body {
                margin : 0px;
                padding : 0px;
            }


            #main {
                width :400px;
                height :400px;
                background-color: rgb(51, 110, 110);
                border: rgb(255, 68, 0) 10px solid;
                margin:auto;
                display: flex;
            }

            .box{
                width: 150px;
                height: 150px;
                background-color: rgb(81, 81, 81);
                border: rgb(0, 0, 0) 5px solid;
                margin-right: 20px;
            }
            .box:nth-child(4){
                margin-right: 0px;
            }

            .box:nth-child(odd){
                background-color: rgb(255, 68, 0);
            }

            .box:nth-child(even){
                background-color: rgb(0, 153, 204);
            }
            
            </style>
    </head>
    <body>
        <div class="main">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </body>
</html>
