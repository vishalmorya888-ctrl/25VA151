<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>STUDENT REGISTRATION FORM</title>
    </head>
    <body>
        <form method="post" action="submit.html">
                
                <h1 align="center">STUDENT REGISTRATION FORM</h1>

                <hr>

                <label for="" > Student Name : </label>
                <input type="text" placeholder="Enter your first name">
                <input type="text" placeholder="Enter your middle name">
                <input type="text" placeholder="Enter your last name"><br><br>

                <label for=""> Date of Birth : </label>
                <input type="date"><br><br>

                <label for=""> Gender :</label>
                <input type="radio" name="gender" value="male">male
                <input type="radio" name="gender" value="female">female
                <input type="radio" name="gender" value="other">other<br><br>

                <label for=""> Course : </label>
                <select name="course">
                    <option>--Select Course--</option>
                    <option>B.Tech</option>
                    <option>M.Tech</option>
                    <option>BCA</option>
                    <option>MBA</option>
                </select><br><br>

                <label for=""> Personal Email : </label>
                <input type="email" placeholder="Enter your Email id"><br><br>

                <label for=""> Professional Email(if applicable) :</label>
                <input type="email" placeholder="Enter your Email id"><br><br>

                <label for=""> Phone No. : </label>
                <input type="tel" placeholder="Enter your phone number"><br><br>

                <label for=""> City : </label>
                <input type="text" placeholder="Enter your city"><br><br>

                <label for=""> State : </label>
                <input type="text" placeholder="Enter your state"><br><br>

                <label for=""> Pincode : </label>
                <input type="tel" placeholder="Enter your pincode"><br><br>

                <label for=""> Address : </label><br>
                <textarea cols="40" rows="4" placeholder="Enter your address"></textarea><br><br>

                <label for=""> Student Photo : </label>
                <input type="file" accept="image/*"><br><br>

                <input type="submit" value="Submit">
                <input type="reset" value="Reset">

        </form>
        <hr>
        <center><small>&copy; 2025 Student Registration Portal</small></center>
    </body>
</html>
