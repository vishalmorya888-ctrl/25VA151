<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BOOKINGS</title>
        <style>
            body {
                background-image: url("pexels.jpg");
                background-repeat: no-repeat;
                background-size: cover;
            }
        </style>
    </head>
    <body align="center">
        <h1><u><b>Hotel Room Booking </b></u></h1>
        <table align="center" border="2" cellpadding="20" cellspacing="0" width="35%">
            <td>
                <form action="" method="post">
                    <label for="">Full Name : </label>
                    <input type="text" placeholder="Enter your Full Name">

                    <p></p>

                    &nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp <label for="">State : </label>
                    <input type="text" placeholder="Enter Your State">

                    <p></p>

                    &nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp <label for="">City : </label>
                    <input type="text" placeholder="Enter your city">

                    <p></p>

                    &nbsp&nbsp <label for="">Pincode : </label>
                    <input type="tel" placeholder="Enter Pincode">

                    <p></p>

                    &nbsp&nbsp <label for="">Address : </label>
                    <input type="text" placeholder="Enter your address">

                    <p></p>

                    <label for="">Phone No. : </label>
                    <input type="tel" placeholder="Enter your phone no.">

                    <p></p>

                    &nbsp&nbsp&nbsp&nbsp&nbsp&nbsp <label for="">Email : </label>
                    <input type="email" name="" id="" placeholder="ex-myname@gmail.com">

                    <p></p>

                    &nbsp&nbsp&nbsp <label for="">Arrival : </label>
                    <input type="date" name="" id="">
                    <input type="time" name="" id="">

                    <p></p>

                    <label for="">Departure : </label>
                    <input type="date" name="" id="">
                    <input type="time" name="" id="">

                    <p></p>

                    <label for="">Room Type : </label>
                    <select name="" id="">
                        <option>--Select Room Type--</option>
                        <option>Single Room</option>
                        <option>Double Room</option>
                        <option>Deluxe Room</option>
                        <option>Suite Room</option>
                    </select>

                    <p></p>

                    <label for="">Number Of Guests : </label>
                    <input type="tel" placeholder="Enter no. of Guests">

                    <p></p>

                    <label for="">Payment method : </label><br>
                    <input type="radio" name="Payment method" value="Check">Check
                    <input type="radio" name="Payment method" value="Credit Card">Credit Card
                    <input type="radio" name="Payment method" value="Debit Card">Debit Card
                    <input type="radio" name="Payment method" value="UPI">UPI

                    <p></p>

                    <label for="">Do you have any special request : </label>
                    <textarea name="" id="" placeholder="Type Here" cols="40" rows="4"></textarea>

                    <p></p>

                    <input type="reset" name="" id="">
                    <input type="submit" name="" id="">

                </form>
            </td>
        </table>
    </body>
</html>
