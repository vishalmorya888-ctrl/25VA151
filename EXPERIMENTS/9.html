<!DOCTYPE html>
<html>
<head>
    <title>Responsive Product Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 20px;
        }
        .product {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }
        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }
        .product:hover {
            box-shadow: 0 0 10px #aaa;
        }
        @media (min-width: 600px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Product Grid</h1>

    <div class="product-grid">

        <div class="product">
            <img src="download.jpg" alt="Product">
            <h3>Product 1</h3>
            <p>₹499</p>
        </div>

        <div class="product">
            <img src="download (1).jpg" alt="Product">
            <h3>Product 2</h3>
            <p>₹799</p>
        </div>

        <div class="product">
            <img src="download (2).jpg" alt="Product">
            <h3>Product 3</h3>
            <p>₹999</p>
        </div>

        <div class="product">
            <img src="download (3).jpg" alt="Product">
            <h3>Product 4</h3>
            <p>₹1299</p>
        </div>

        <div class="product">
            <img src="download (4).jpg" alt="Product">
            <h3>Product 5</h3>
            <p>₹1499</p>
        </div>

        <div class="product">
            <img src="download (5).jpg" alt="Product">
            <h3>Product 6</h3>
            <p>₹1999</p>
        </div>

    </div>

</body>
</html>
