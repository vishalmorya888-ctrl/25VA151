<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        div {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            place-items: auto;
            background-color: #f0f0f0;
            padding: 10px;
        }
        div > div {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .left {
            justify-items: start;
            background-color: lightcoral;
        }
        .right {
            justify-items: end;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h1>Grid Layout Example</h1>
    <div>
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
    </div>
    <h2>Left Aligned Grid Items</h2>
    <div class="left">
        <div>Item A</div>
        <div>Item B</div>
        <div>Item C</div>
        <div>Item D</div>
        <div>Item E</div>
        <div>Item F</div>
    </div>
    <h2>Right Aligned Grid Items</h2>
    <div class="right">
        <div>Item X</div>
        <div>Item Y</div>
        <div>Item Z</div>
        <div>Item W</div>
        <div>Item V</div>
        <div>Item U</div>
    </div>
</body>
</html>
